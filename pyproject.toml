[project]
name = "volant"
version = "0.0.1"
description = "Volant Script"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Serban Giuroiu", email = "giuroiu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.urls]
repository = "https://github.com/serban/volant"
changelog = "https://github.com/serban/volant/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
  "basedpyright>=1.29.4",
  "coverage>=7.9.1",
  "mypy>=1.16.1",
  "pdoc>=15.0.4",
  "pyrefly>=0.20.1",
  "reuse>=5.0.2",
  "ruff>=0.12.0",
  "ty>=0.0.1a11",
]

[build-system]
requires = ["uv_build>=0.7.11,<0.8"]
build-backend = "uv_build"
